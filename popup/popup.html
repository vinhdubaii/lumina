<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<title>Lumina</title>
<link rel="stylesheet" href="../shared/tokens.css" />
<link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="header">
    <div class="wordmark">
      <span class="wordmark-dot" aria-hidden="true"></span>
      Lumina
    </div>
    <button id="settings-btn" class="icon-btn" aria-label="Cài đặt" title="Quản lý tất cả trang">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <path d="M8 5.2A2.8 2.8 0 108 10.8 2.8 2.8 0 008 5.2z" stroke="currentColor" stroke-width="1.3"/>
        <path d="M13.4 8.7v-1.4l-1.5-.3a4.6 4.6 0 00-.5-1.2l.9-1.2-1-1-1.2.9a4.6 4.6 0 00-1.2-.5L8.6 2.6H7.2l-.3 1.4a4.6 4.6 0 00-1.2.5l-1.2-.9-1 1 .9 1.2a4.6 4.6 0 00-.5 1.2l-1.5.3v1.4l1.5.3c.1.4.3.8.5 1.2l-.9 1.2 1 1 1.2-.9c.4.2.8.4 1.2.5l.3 1.5h1.4l.3-1.5c.4-.1.8-.3 1.2-.5l1.2.9 1-1-.9-1.2c.2-.4.4-.8.5-1.2l1.5-.3z" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"/>
      </svg>
    </button>
  </header>

  <main id="main-content">
    <!-- filled by popup.js: tracked view, untracked view, or no-tab view -->
  </main>

  <template id="tracked-view-template">
    <div class="site-hero">
      <svg class="dial" viewBox="0 0 100 100" width="88" height="88">
        <circle class="dial-track" cx="50" cy="50" r="42" />
        <circle class="dial-progress" cx="50" cy="50" r="42" />
      </svg>
      <div class="site-hero-text">
        <div class="site-domain"></div>
        <div class="site-remaining"></div>
        <div class="site-limit"></div>
      </div>
    </div>
    <div class="history">
      <div class="history-label">Những ngày gần đây</div>
      <div class="history-bars"></div>
    </div>
  </template>

  <template id="untracked-view-template">
    <div class="untracked">
      <div class="site-domain untracked-domain"></div>
      <p class="untracked-msg">Trang này chưa có giới hạn thời gian.</p>
      <form id="quick-add-form" class="quick-add-form">
        <input id="quick-minutes" type="number" min="1" max="1440" value="30" />
        <span class="unit">phút / ngày</span>
        <button type="submit" class="btn-primary">Giới hạn</button>
      </form>
    </div>
  </template>

  <template id="empty-view-template">
    <div class="untracked">
      <p class="untracked-msg">Mở một trang web để xem thời lượng dùng của tab đó.</p>
    </div>
  </template>

  <script src="popup.js"></script>
</body>
</html>
